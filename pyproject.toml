[project]
name = "testplan"
version = "0.1.0"
description = "A pytest plugin: run the tests whose code, data or packages changed since they passed, last failures first then the fastest, under a time budget, every run's times kept."
requires-python = ">=3.12"
dependencies = ["pytest>=8.0.0"]

[project.entry-points.pytest11]
testplan = "testplan.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["testplan"]

[dependency-groups]
dev = ["quern"]

[tool.uv.sources]
quern = { git = "https://github.com/xag/quern", rev = "07eff6efc0625ee0613a083095db4e6b75be7284" }

[tool.pytest.ini_options]
# Fail fast: stop at the first failure. The plugin itself picks, orders and budgets the tests.
addopts = "-x"
